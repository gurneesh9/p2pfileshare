# fly.toml app configuration file generated for xend-relay on 2026-07-11T12:01:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xend-relay'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  RUST_LOG = 'info'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443

  [[services.ports]]
    port = 8443

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
