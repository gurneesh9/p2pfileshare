[package]
name = "xend-core"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib  → produces libxend_core.dylib / .so / .dll (FRB native FFI)
# lib     → keeps the normal .rlib for xend-cli and tests
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Phase 1 — identity, DHT, contacts
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand         = "0.8"
sha1         = "0.10"
sha2         = "0.10"
hex          = "0.4"
bip39        = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
rusqlite     = { version = "0.31", features = ["bundled"] }
uuid         = { version = "1", features = ["v4"] }
thiserror    = "1"
tracing      = "0.1"
mainline     = "2"

# Phase 2 — QUIC + TLS + Noise
quinn  = "0.11"
rcgen  = "0.13"
rustls = { version = "0.23", features = ["ring"] }
snow   = "0.9"

# Phase 3 — file transfer
rmp-serde = "1"
mdns-sd = "0.20"
socket2 = { version = "0.5", features = ["all"] }

flutter_rust_bridge = "=2.12.0"

[build-dependencies]
flutter_rust_bridge_codegen = "2"

[dev-dependencies]
tempfile = "3"
